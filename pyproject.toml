[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macs"
version = "0.1.0"
description = "Multi-Agent Coding Studio with trace-based creativity measurement"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "radon>=6.0",
    "black>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "statsmodels>=0.14", "pandas>=2.0", "python-docx>=1.1", "openpyxl>=3.1"]   # statsmodels cross-checks the S8 model
embed = ["torch", "transformers>=4.40"]
ui = ["streamlit>=1.37", "pandas>=2.0", "python-docx>=1.1", "openpyxl>=3.1"]       # dashboard (auto-refreshing job panels need 1.37+)   # UniXcoder; install separately on the GPU machine

[tool.setuptools.packages.find]
include = ["macs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # tests import helpers from tests.test_orchestrator
