# Copy to config/models.yaml and edit. models.yaml is git-ignored.
# Every backend speaks the OpenAI chat-completions protocol, so swapping is a config change only.

default_profile: local

profiles:
  local:                      # development on the laptop
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: qwen2.5-coder:7b-instruct-q4_K_M         
    revision: "dae161e27b0e"                    
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048
    # extra_body: {reasoning_effort: none}   # extra request fields, e.g. thinking off for Qwen3.5

  deepseek:                   # DeepSeek, free: open weights run locally through Ollama.
                              # Install once with:  ollama pull deepseek-coder-v2:16b
                              # Used as the independent AI judge (ethics Method 4).
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: deepseek-coder-v2:16b
    revision: ""                     # paste the ID shown by `ollama list` to pin it
    quantisation: q4_0
    temperature: 0.7
    max_tokens: 2048

seed: 20260921
cache_dir: data/cache
