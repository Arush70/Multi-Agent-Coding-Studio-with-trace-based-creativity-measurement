# Copy to config/models.yaml and edit. models.yaml is git-ignored.
# Every backend speaks the OpenAI chat-completions protocol, so swapping is a config change only.

default_profile: local

profiles:
  local:                      # development on the laptop
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: qwen2.5-coder:7b-instruct-q4_K_M         
    revision: "dae161e27b0e"                    
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048
    # extra_body: {reasoning_effort: none}   # extra request fields, e.g. thinking off for Qwen3.5

  claude:                     # Claude API (OpenAI-compatible endpoint). Put your key in the
                              # ANTHROPIC_API_KEY environment variable, or paste it below.
    base_url: https://api.anthropic.com/v1
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-5-5         # or claude-opus-5-5 / claude-haiku-5-5
    revision: ""                     # API models are pinned by their model id
    quantisation: provider
    temperature: 1.0                 # newer Claude models reject a temperature below 1
    max_tokens: 2048

seed: 20260921
cache_dir: data/cache
