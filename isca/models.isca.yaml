# Model profiles for ISCA (University of Exeter HPC). isca/setup.sh copies this to
# config/models.yaml and fills in each revision from `ollama list`. No keys are stored here.
# OLLAMA_HOST is set by the job script, so every job talks to its own Ollama server.

default_profile: qwen35_27b

profiles:
  qwen35_27b:                 # main model by the 15 Oct 2026 decision rule (GPU available by 26 Oct)
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: qwen3.5:27b
    revision: ""
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048
    extra_body: {reasoning_effort: none}

  qwen35_122b:                # Qwen3.5-122B-A10B (MoE, 10B active; Apache 2.0): the largest Qwen3.5
                              # that fits one ISCA node (about 70 GB at 4-bit, run on both A100s).
                              # Scale point added on 22 Oct 2026 before any 27B results; reduced design.
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: qwen3.5:122b
    revision: ""
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048
    extra_body: {reasoning_effort: none}

  # ---- large open models from other families (cross-model panel on ISCA, added 22 Oct 2026) ----
  gpt_oss_120b:               # OpenAI gpt-oss 120B (MoE; Apache 2.0); about 65 GB, one A100
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: gpt-oss:120b
    revision: ""
    quantisation: mxfp4
    temperature: 0.7
    max_tokens: 4096
    extra_body: {reasoning_effort: low}

  llama4_scout:               # Meta Llama 4 Scout 109B (16 experts, 17B active); about 67 GB, both A100s
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: llama4:16x17b
    revision: ""
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048

  gemma4_31b:                 # Google Gemma 4 31B (dense); about 20 GB, one A100
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: gemma4:31b
    revision: ""
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048

  gpt_oss_20b:                # optional cross-model panel member
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: gpt-oss:20b
    revision: ""
    quantisation: mxfp4
    temperature: 0.7
    max_tokens: 4096
    extra_body: {reasoning_effort: low}

  local:                      # same 9B model as the laptop (only if you want it on ISCA too)
    base_url: http://${OLLAMA_HOST}/v1
    api_key: ollama
    model: qwen3.5:9b
    revision: "56671c2ab938"
    quantisation: q4_K_M
    temperature: 0.7
    max_tokens: 2048
    extra_body: {reasoning_effort: none}

seed: 20260921
cache_dir: data/cache
