# Tier 3 HARD / OPEN problem. Graph colouring is NP-hard; it is one of the 36 problems in CO-Bench.
# Source: Sun, W. et al. (2025), CO-Bench: Benchmarking Language Model Agents in Algorithm Search for Combinatorial Optimization, arXiv:2504.04310 (problem: Graph colouring)
# (Corrected 2026-11-02: earlier cited ReEvo, which does not include graph colouring. Problem unchanged.)
# NP-hard / open: there is no known optimal polynomial algorithm, so solutions are
# scored by a metric, not pass/fail. This is where creativity has the most room.
# known_families are BLIND LABELS (named heuristics), written before any model output.
id: t3_graph_coloring
tier: 3
source: research
citation: "Sun, W. et al. (2025), CO-Bench: Benchmarking Language Model Agents in Algorithm Search for Combinatorial Optimization, arXiv:2504.04310 (problem: Graph colouring)"
entry_point: vertex_order
title: Greedy graph-colouring order
prompt: |
  Given an adjacency structure `graph` (dict: vertex -> set of neighbours), write
  `vertex_order(graph)` returning a list of all vertices in the order a greedy colouring should
  process them. Greedy colouring in that order should use as FEW colours as possible.
known_families:
  - largest_first   # order by descending degree (Welsh-Powell)
  - dsatur          # dynamic saturation degree order
  - smallest_last   # repeatedly remove the min-degree vertex
  - random_order    # baseline arbitrary order
public_tests:
  - "assert sorted(vertex_order({0:{1},1:{0},2:set()}))==[0,1,2]"
heldout_tests: []
scoring: heuristic
heuristic:
  instance_file: instances.json   # frozen once by scripts/make_graph_instances.py
  seeds: [1, 2, 3, 4, 5]
  baseline: largest_first
  baseline_colors: null
