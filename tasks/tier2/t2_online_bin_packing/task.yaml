# Tier 2 HEURISTIC task. No pass/fail tests decide correctness - a metric does.
# This is the "unsolved-style" task where creativity has the most room to show.
# known_families are blind labels written before any model output was seen.
id: t2_online_bin_packing
tier: 2
source: heuristic
title: Online bin-packing heuristic
entry_point: priority
prompt: |
  Items of size in (0, 1] arrive one at a time and must be placed immediately into a bin of
  capacity 1.0 (bins are never revisited). Write `priority(item, bins)` returning, for each
  bin in `bins` (a list of remaining capacities), a priority score; the item is placed in the
  feasible bin with the highest score, or a new bin is opened if none fits. Fewer bins is better.
known_families:
  - first_fit             # score = -index (earliest feasible bin)
  - best_fit              # score = -(remaining - item) (tightest fit)
  - worst_fit             # score = +(remaining - item) (loosest fit)
  - threshold_or_penalty  # non-linear: penalise leaving a near-empty sliver
public_tests:
  - "assert len(priority(0.5,[0.6,0.4,0.9]))==3"
  - "assert priority(0.5,[0.6,0.4,0.9]).index(max(priority(0.5,[0.6,0.4,0.9]))) in (0,2)"
heldout_tests: []
scoring: heuristic
heuristic:
  instance_file: instances.json   # generated once by scripts/make_binpack_instances.py, committed, never regenerated
  seeds: [1, 2, 3, 4, 5]
  baseline: best_fit              # score = (baseline_bins - candidate_bins) / baseline_bins, averaged over seeds
  baseline_bins: null             # filled when instances are frozen
