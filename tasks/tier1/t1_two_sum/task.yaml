# Tier 1 task. known_families are BLIND LABELS: the distinct algorithmic strategies,
# written before any model output was seen. Do not edit them to match results.
# Held-out tests are never shown to agents (the loader strips them); only the scorer reads them.
id: t1_two_sum
tier: 1
source: curated
title: Two sum
entry_point: two_sum
prompt: |
  Given a list of integers `nums` and an integer `target`, return the indices of the two distinct
  elements whose values sum to `target`, as a list `[i, j]` with `i < j`. Exactly one valid pair exists.
known_families:
  - brute_force_pairs   # O(n^2) nested loops
  - sort_two_pointer    # sort (value,index), walk two pointers, O(n log n)
  - single_pass_hash    # dict of complements seen so far, O(n)
public_tests:
  - "assert two_sum([2,7,11,15],9)==[0,1]"
  - "assert two_sum([3,2,4],6)==[1,2]"
heldout_tests:
  - "assert two_sum([3,3],6)==[0,1]"
  - "assert two_sum([-1,-2,-3,-4,-5],-8)==[2,4]"
  - "assert two_sum([1,5,1,5],10)==[1,3]"
  - "assert two_sum(list(range(10000))+[20000,30000],50000)==[10000,10001]"
scoring: tests
